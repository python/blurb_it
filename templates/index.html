{% extends "base.html" %}

{% block content %}
    <div class="text-center py-5">
        <a href="/"><img class="mb-4" src="https://www.python.org/static/community_logos/python-logo-master-v3-TM.png" alt="" height="72"></a>
        <h1 class="display-5 fw-semibold">📜🤖 Blurb it!</h1>
        <p class="lead text-body-secondary mb-4"><a href="https://devguide.python.org/getting-started/pull-request-lifecycle/#news-entry">Add a blurb</a> to your CPython pull request.</p>
        <a class="btn btn-dark btn-lg" href="https://github.com/login/oauth/authorize?client_id={{ client_id }}&scope=repo&redirect_uri={{ app_protocol }}://{{ app_url }}/add_blurb">
            <span class="fa fa-github me-1" aria-hidden="true"></span>
            Sign in with GitHub
        </a>
    </div>
{% endblock %}
